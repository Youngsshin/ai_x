<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <title></title>
    <style>
        table {width:280px; height: 100px; margin: 10px auto;} h3{text-align:center;}
    </style>

    <script>
        // window.onload = () => {
        // var tds = 엘리먼트들 가져오기
        //     var td = document.getElementsByTagName('td');
        //     // for문 이용하여 tds의 background-color 바꾸기
        // };
        const bgColorChange = () => {
            var tds = document.getElementsByTagName('td');
            var color = ['red', 'orange', 'yellow', 'green', 'blue', 'navy', 'black']
            for(let idx=0; idx<tds.length; idx++){
                tds[idx].style = 'background-color:' + color[idx];
            }
        };
    </script>
</head>
<body>
    <h3>quiz1 : 마우스를 올리면 바탕화면도 해당 색상으로</h3>
    <table>
        <tr onmouseout="bgColorChange()"> <!-- tr에 마우스를 빼면 바탕화면이 하얀색으로 -->
            <td onmouseover=""></td> <!-- td에 마우스를 올리면 td색상으로 -->
            <td onmouseover=""></td>
            <td onmouseover=""></td>
            <td onmouseover=""></td>
            <td onmouseover=""></td>
            <td onmouseover=""></td>
            <td onmouseover=""></td>
        </tr>
    </table>
</body>
</html>
