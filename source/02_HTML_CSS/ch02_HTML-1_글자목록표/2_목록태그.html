<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>목록태그</title>
</head>
<body>
    <p>순서가 있는 목록태그(ordered list : 1,2,3.. i, ii, iii)</p>
    <ol type="a">
        <!-- type = 1(기본값), a, A, i, I -->
        <li>Python</li>
        <li>웹표준</li>
        <li>웹크롤링</li>
    </ol>
    <p>순서가 없는 목록태그(unordered list)</p>
    <ul typeof="disc"> <!-- type=disc(기본값), circle, square -->
        <li>Python</li>
        <li>웹표준</li>
        <li>웹크롤링</li>
    </ul>
</body>
</html>
