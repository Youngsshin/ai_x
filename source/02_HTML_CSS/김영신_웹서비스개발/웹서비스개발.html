<!DOCTYPE html>

<head>

    <link href="웹서비스개발.css" rel="stylesheet" />
    <title>웹서비스 개발_구현</title>
</head>
<body>
    <div id="wrap">
        <nav>
            <div id="nav_left">
                <ul>
                    <li><a href="#">LOGO</a></li>
                    <li><a href="#">참여하기</a></li>
                    <li><a href="#">개설하기</a></li>
                    <li><a href="#">검색하기</a></li>
                </ul>
            </div>
            <div id="nav_right">
                <ul>
                    <li><a href="#">고객센터</a></li>
                    <li><a href="#">로그아웃</a></li>
                    <li><a href="#">홍길동님</a></li>
                </ul>
            </div>
        </nav>
        <div id="content">
            <div id="title">마이페이지</div>
            <div id="lnb">
                <ul>
                    <li><a href="#">나의여행</a></li>
                    <li><a href="#">참여여행</a></li>
                    <li><a href="#">관심여행</a></li>
                    <li class="color_btn"><a href="#">개인정보변경</a></li>
                    <li><a href="#">비밀번호변경</a></li>
                </ul>
            </div>
            <div id="my_content">
                <div id="sub_title">개인정보변경</div>
                <div id="modify">
                    <form>
                        <table>
                            <tr>
                                <td>이름</td>
                                <td><input type="text" name="name" /></td>
                            </tr>
                            <tr>
                                <td>아이디</td>
                                <td><input type="text" name="id" /></td>
                            </tr>
                            <tr>
                                <td>이메일</td>
                                <td><input type="email" name="email" /></td>
                            </tr>
                            <tr>
                                <td>전화</td>
                                <td><input type="text" name="phone" /></td>
                            </tr>
                            <tr>
                                <td>생년월일</td>
                                <td><input type="text" name="birth" /></td>
                            </tr>
                            <tr>
                                <td>주소</td>
                                <td><input type="text" name="address" /></td>
                            </tr>
                        </table>
                    </form>
                    <p>
                        <input type="submit" value="저장" />
                    </p>
                </div>
            </div>
        </div>
        <footer>footer</footer>
