<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>url함수</title>
    <style>
        @font-face {
            font-family: 'NanumGN';
            src: url('ch05/NanumGgocNaeEum.ttf');
        }
        * {
            font-family: 'NanumGN', 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
        #wrap {
            width:600px;
            height:400px;
            margin:10px auto;
            border:1px solid gray;
            text-align:center;
        }
        #wrap #content{
            border:1px solid red;
            width:80%;
            height:100%;
            margin:0 auto;
            background:url('ch05/sulhyun.jpg') center no-repeat;
            background-size:120%; /* div 가로 사이즈 기준으로 */
            font-size:3em;
            color:white;
        }
    </style>
</head>
<body>
    <div id="wrap">
        <div id="content">
            설현?
        </div>
    </div>
</body>
</html>
