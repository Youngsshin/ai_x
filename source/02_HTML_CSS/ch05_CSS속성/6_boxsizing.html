<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>boxing-sizing</title>
    <style>
        *{
            margin:0;
            padding:0;
        }
        div:nth-child(1),
        div:nth-child(2),
        div:nth-child(3){
            width:100px;
            height:100px;
            border:10px solid red;
            background-color:yellow;
        }
        div:nth-child(2){
            box-sizing:border-box; /* border를 width와 height에 편입 */
        }
        div:nth-child(3){
            border:none;
        }
        div#smartphone_layout {
        }
        ul{
            overflow:hidden;
        }
        ul li{
            float:left;
            list-style:none;
            width:31.3%;
            margin:1%;
            border:1px solid gray;
            box-sizing:border-box;
        }
        ul li a{
            text-decoration:none;
            color:black;
            border:1px solid red;
            display:block;
            padding:25px;
        }
    </style>
</head>
<body>
    <div>111</div><div>222</div><div>333</div>
    <div id="smartphone_layout">
        <ul>
            <li><a href="#">menu1</a></li>
            <li><a href="#">menu2</a></li>
            <li><a href="#">menu3</a></li>
        </ul>
    </div>
</body>
</html>
