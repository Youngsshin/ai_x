<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>속성선택자</title>
    <style>
        div#wrap{
            width:500px;
            margin:0 auto;
        }
        #wrap #header{
            color:orange;
            text-align:center;
        }
        #wrap #section{
            border-top:1px solid #ccc;
            border-bottom:1px solid #ccc;
            padding:15px 20px;
        }
        #wrap #section h4[title^='남자']{
            background:url('ch04/man.png') no-repeat;
            padding:0 0 0 30px;
        }
        #wrap #section h4[title^='여자']{
            background:url('ch04/woman.png') no-repeat;
            padding-left:30px;
        }
        #wrap #section p{
            text-align:center;
        }
        #wrap #section p a{
            color:blue;
            text-decoration:none;
        }
        #wrap a[href$='docx'], #wrap a[href$='doc']{
            background:url('ch04/word.png') right no-repeat;
            padding-right:30px;
        }
        #wrap a[href$='xlsx'], #wrap a[href$='xls'] {
            background: url('ch04/excel.png') right no-repeat;
            padding-right: 30px;
        }
        #wrap #footer p {
            text-align: center;
            color: gray;
            padding: 15px 0;
            /* font-size:.8em; 원래 글씨 사이즈의 0.8배 */
        }
    </style>
</head>
<body>
    <div id="wrap">
        <div id="header">
            <h1>객실안내</h1>
        </div>
        <div id="section">
            <h4 title="남자도미토리">남자 도미토리</h4>
            <ul>
                <li>공동취사실 및 욕실(화장실) 사용</li>
                <li>1인 20,000원(비수기), 25,000원(성수기)</li>
            </ul>
            <h4 title="여자도미토리">여자 도미토리</h4>
            <ul>
                <li>취사 기구 완비 실내 욕실(화장실) 사용</li>
                <li>1인 30,000원(비수기), 40,000원(성수기)</li>
            </ul>
            <p><a href="ch04/intro.docx">유의사항 다운로드</a></p>
            <p><a href="ch04/intro.xlsx">객실자료 다운로드</a></p>
        </div>
        <div id="footer">
            <p>서울시 마포구 노고산동 그랜드빌딩 704호</p>
        </div>
    </div>
</body>
</html>
