<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>구조선택자</title>
    <style>
        *{
            margin:0;
            padding:0;
        }
        #nav{
            width:200px;
            margin:15px auto;
        }
        #nav ul li{
            list-style:none;
            border:1px solid gray;
            padding:15px;
            text-align:center;
            font-size:20px;
            font-weight:bold;
            margin-bottom:3px;
        }
        #nav ul li a{ /* 밑줄없애기, 글씨 색상 - a태그 */
            text-decoration:none;
            color:black;
        }
        #nav ul li:nth-child(2n+1){ /* ul밑의 li중 홀수번째, 첫번째가 1 */
            background-color:orange;
        }
        #nav ul li:nth-child(2n){ /* ul밑의 li중 짝수번째 */
            background-color:yellow;
        }
        #nav ul li:first-child{
            border-radius:15px 15px 0 0;
        }
        #nav ul li:last-child{
            border-radius:0 0 15px 15px;
        }
    </style>
</head>
<body>
    <div id="nav">
        <ul>
            <li><a href="http://www.naver.com" target="_blank">menu1</a></li>
            <li><a href="#">menu2</a></li>
            <li><a href="#">menu3</a></li>
            <li><a href="#">menu4</a></li>
            <li><a href="#">menu5</a></li>
            <li><a href="#">menu6</a></li>
            <li><a href="#">menu7</a></li>
            <li><a href="#">menu8</a></li>
        </ul>
    </div>
</body>
</html>
