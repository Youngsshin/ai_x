<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        h1, p{
            text-align:center;
        }
        p{
            font-size:16px;
            margin:0 auto;
            padding:15px 0 35px;
        }
        table td{
            text-align:center;
        }
        span{
            color:red;
            font-weight:bold;
        }
    </style>
</head>
<body>
    <script>
        function chk() {
            if (frm.name.value.length < 2) {
                alert('이름은 2글자 이상 필수입력입니다');
                frm.name.focus();
                return false;
            } else if (frm.id.value.length < 4) {
                alert('아이디는 4글자 이상 필수입력입니다');
                frm.id.focus();
                return false;
            } else if (frm.pw.value.length < 1) {
                alert('비밀번호는 1글자 이상 필수입력입니다');
                frm.pw.focus();
                return false;
            } else if (frm.pw.value != frm.pwChk.value) {
                alert('비밀번호를 확인하세요');
                frm.pw.value = '';
                frm.pwChk.value = '';
                frm.pw.focus();
                return false;
            }
            return true;
        }
    </script>
    <header>
        <h1>회원가입</h1>
    </header>
    <content>
        <form name="frm" onsubmit="return chk()">
            <fieldset>
                <legend>필수입력</legend>
                <table>
                    <tr>
                        <td>이름<span>*</span></td>
                        <td><input type="text" name="name" placeholder="이름은 2글자 이상" /></td>
                    </tr>
                    <tr>
                        <td>아이디<span>*</span></td>
                        <td><input type="text" name="id" placeholder="ID는 4글자 이상" /></td>
                    </tr>
                    <tr>
                        <td>비밀번호<span>*</span></td>
                        <td><input type="password" name="pw" /></td>
                    </tr>
                    <tr>
                        <td>비번확인<span>*</span></td>
                        <td><input type="password" name="pwChk" /></td>
                    </tr>
                    <tr>
                        <td>전화<span>*</span></td>
                        <td>
                            <input type="tel" name="tel" placeholder="xx-xxx-xxxx/000-0000-0000"
                                   pattern="[0-9]{2,3}-\d{3,4}-\d{4}" />
                        </td>
                    </tr>
                    <tr>
                        <td>이메일<span>*</span></td>
                        <td>
                            <input type="email" name="email" placeholder="id@domain.com 또는 co.kr"
                                   pattern="[a-zA-Z0-9가-힣]+@[a-zA-Z0-9]+(\.[a-zA-Z]+){1,2}" />
                        </td>
                    </tr>
                </table>
            </fieldset>
            <fieldset>
                <legend>추가 입력 사항</legend>
                    <table>
                        <tr>
                            <td>결혼유 무</td>
                            <td>
                                <input type="radio" name="marry" /> 기혼
                                <input type="radio" name="marry" /> 미혼
                            </td>
                        </tr>
                        <tr>
                            <td>자식</td>
                            <td>
                                <input type="checkbox" name="chl" /> 아들
                                <input type="checkbox" name="chl" /> 딸
                            </td>
                        </tr>
                        <tr>
                            <td>지역</td>
                            <td>
                                <select>
                                    <option>서울</option>
                                    <option selected="selected">경기</option>
                                    <option>인천</option>
                                </select>
                            </td>
                        </tr>
                    </table>
            </fieldset>
            <p>
                <input type="submit" value="가입" />
                <input type="reset" value="취소" />
            </p>
        </form>
    </content>
    <hr color="#ddd" />
    <footer>
        <p>
            서울시 서대문구 신촌로 141 은하빌딩 203호<br />
            Copyright &copy; XX All rights reserved.
        </p>
    </footer>
</body>
</html>
