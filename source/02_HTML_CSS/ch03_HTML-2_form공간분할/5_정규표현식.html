<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>정규표현식</title>
    <style>
        form{
            width:370px;
        }
    </style>
    <script></script>
</head>
<body>
    <!--
        정규표현식(https://ko.wikipedia.org/wiki/정규표현식)
        ? : 0~1번 반복
        + : 1번이상 반복
        * : 0번이상 반복
        | : 또는
        {2, } : 2번이상 반복
        {m, n} : m번에서 n번 사이 반복
        {n} : n번 반복
        \d, [0,9] : 숫자
        \D : 숫자가 아닌 것
        \w, [a-zA-Z0-9] : 영문자나 숫자
        가-힣 : 한글
        . : \n을 제외한 문자
        \. : .
        [~!@#%&^*()\-\\_+={}:;""''.,] : 특수문자
        ex) 전화번호 : [0-9]{2,3}-\d{3,4}-\d{4}
        ex) 이메일 : [a-zA-Z0-9가-힣]+@[a-zA-Z0-9]+(\.[a-zA-Z]+){1,2}
                     [a-zA-Z0-9가-힣]+@[a-zA-Z0-9]+\.[a-zA-Z]+(\.[a-zA-Z]+)?
    -->
    <form>
        <fieldset>
            <legend>필드에 입력형식 힌트 주는 사용자 인터페이스</legend>
            <ul>
                <li>
                    <label for="tel">연락처 : </label>
                    <input type="tel" name="tel" id="tel" required="required" placeholder="010-0000-0000"
                           pattern="[0-9]{2,3}-\d{3,4}-\d{4}" title="전화번호 형식이 맞지 않습니다(xx-xxx-xxxx/010-0000-0000)"
                           autofocus="autofocus"/>
                </li>
                <li>
                    <label for="email">이메일 : </label>
                    <input type="email" name="email" id="email" placeholder="id@domain.com" 
                           pattern="[a-zA-Z0-9가-힣]+@[a-zA-Z0-9]+(\.[a-zA-Z]+){1,2}" />
                </li>
            </ul>
            <p>
                <center>
                    <input type="submit" value="입력완료" />
                    <input type="reset" value="입력취소" />
                </center>
            </p>
        </fieldset>
    </form>
</body>
</html>
